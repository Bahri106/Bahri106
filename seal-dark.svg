<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="BAHRY">
  <title>BAHRY</title>
  <style>
    /* Jalur utama: selalu penuh. Tidak ada dashoffset, tidak ada ketergantungan
       pada animasi. Ini yang tampil di setiap kondisi. */
    .mark {
      animation: glow 5s ease-in-out infinite;
    }
    @keyframes glow {
      0%,100% { opacity: .88; }
      50%     { opacity: 1; }
    }
    /* Kilau: potongan pendek yang menyusuri jalur, berulang tanpa henti.
       Default tak terlihat, jadi kalau animasi tidak berjalan tidak ada
       coretan nyasar. */
    .sweep {
      opacity: 0;
      stroke-dasharray: 70 4616.9;
      animation: sweepIn .6s ease-out .8s forwards,
                 sweep 6s cubic-bezier(.45,0,.55,1) .8s infinite;
    }
    @keyframes sweepIn { to { opacity: .95; } }
    @keyframes sweep   {
      from { stroke-dashoffset: 4616.9; }
      to   { stroke-dashoffset: -70; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark  { animation: none; }
      .sweep { display: none; }
    }
  </style>

  <rect width="720" height="720" fill="#0b0e14"/>


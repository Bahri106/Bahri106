<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720" width="720" height="720" role="img" aria-label="BAHRY">
  <title>BAHRY</title>
  <style>
    .draw {
      stroke-dasharray: 4616.9;
      stroke-dashoffset: 4616.9;
      animation: draw 4.6s cubic-bezier(.62,0,.36,1) forwards, glow 5s ease-in-out 4.6s infinite;
    }
    @keyframes draw {
      0%   { stroke-dashoffset: 4616.9; }
      70%  { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes glow {
      0%,100% { opacity: .82; }
      50%     { opacity: 1; }
    }
    /* Ujung pena: potongan pendek terang yang bergerak di sepanjang jalur,
       sinkron dengan garis yang sedang digambar. Memakai stroke-dasharray
       saja — bukan offset-path — supaya tidak bergantung pada dukungan
       CSS positioning yang tidak merata di renderer SVG. */
    .trail {
      stroke-dasharray: 40 4616.9;
      stroke-dashoffset: 4576.9;
      animation: trail 4.6s cubic-bezier(.62,0,.36,1) forwards,
                 trailOut .5s ease-in 4.3s forwards;
    }
    @keyframes trail    { to { stroke-dashoffset: -40; } }
    @keyframes trailOut { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .draw  { stroke-dashoffset: 0; animation: none; }
      .trail { display: none; }
    }
  </style>

  <rect width="720" height="720" fill="#f7f8fa"/>
